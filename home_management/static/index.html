<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maison</title>
  <meta name="description" content="Calendrier, tâches ménagères et courses du foyer">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Maison">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v=1.2.0">
</head>
<body>
  <div id="app" class="app">
    <nav class="nav" aria-label="Menu principal">
      <div class="nav-brand">
        <img src="/static/icons/icon.svg" alt="" width="32" height="32">
        <span>Maison</span>
      </div>
      <button class="nav-item" data-action="go" data-view="home" aria-label="Accueil">
        <svg class="ico"><use href="#i-home"/></svg><span>Accueil</span>
      </button>
      <button class="nav-item" data-action="go" data-view="calendar" aria-label="Calendrier">
        <svg class="ico"><use href="#i-calendar"/></svg><span>Calendrier</span>
      </button>
      <button class="nav-item" data-action="go" data-view="chores" aria-label="Tâches ménagères">
        <svg class="ico"><use href="#i-broom"/></svg><span>Tâches</span><b class="badge" id="badge-chores" hidden></b>
      </button>
      <button class="nav-item" data-action="go" data-view="shopping" aria-label="Courses">
        <svg class="ico"><use href="#i-cart"/></svg><span>Courses</span><b class="badge" id="badge-shopping" hidden></b>
      </button>
      <div class="nav-spacer"></div>
      <button class="nav-item nav-secondary" data-action="go" data-view="history" aria-label="Historique">
        <svg class="ico"><use href="#i-history"/></svg><span>Historique</span>
      </button>
      <button class="nav-item nav-secondary" data-action="open-settings" aria-label="Réglages">
        <svg class="ico"><use href="#i-settings"/></svg><span>Réglages</span>
      </button>
    </nav>

    <div class="shell">
      <header class="topbar">
        <div>
          <h1 id="view-title">Maison</h1>
          <p id="clock" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <span id="sync-dot" class="sync-dot" title="Synchronisé"></span>
          <button class="icon-btn mobile-only" data-action="go" data-view="history" aria-label="Historique">
            <svg class="ico"><use href="#i-history"/></svg>
          </button>
          <button class="icon-btn mobile-only" data-action="open-settings" aria-label="Réglages">
            <svg class="ico"><use href="#i-settings"/></svg>
          </button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <button id="fab" class="fab" data-action="fab" aria-label="Ajouter" hidden>
      <svg class="ico"><use href="#i-plus"/></svg>
    </button>
  </div>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" data-action="close-sheet" aria-label="Fermer"><svg class="ico"><use href="#i-close"/></svg></button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="alert-root" class="alert-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11.5h4.5v-6h4v6h4.5V9"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
      <symbol id="i-broom" viewBox="0 0 24 24"><path d="M14.5 3.5 10 12"/><path d="M6.5 11.5 13.5 15 12 21H3.5l3-9.5z"/><path d="M7 21l2-4.5M10 21l1.2-3"/></symbol>
      <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 3.5h2.7l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1l1.8-7.3H6.1"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 3.5V8h4.5M12 7.5V12l3 2"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2.5 20.5 6 17 9.5"/><path d="M3.5 11.5V10a4 4 0 0 1 4-4h13M7 21.5 3.5 18 7 14.5"/><path d="M20.5 12.5V14a4 4 0 0 1-4 4h-13"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16M9.5 6.5V4h5v2.5M6 6.5l1 14h10l1-14"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="18.5" cy="12" r=".8"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    </defs>
  </svg>

  <script src="/static/app.js?v=1.2.0" defer></script>
</body>
</html>
